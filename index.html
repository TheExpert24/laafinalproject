<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.cdnfonts.com/css/olde-english" rel="stylesheet">
<title>LAA Final Project</title>

<style>
body{
    margin:0;
    overflow:hidden;
}

.hero{
    height:100vh;

    background-image:url("./images/brutusdeath.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:20px;
    box-sizing:border-box;

    position:relative;
    transition:transform 1s ease, opacity 1s ease;
}

.hero h1{
    color:white;
    font-family:'Olde English',sans-serif;
    font-size:2.7rem;
    text-shadow:0 0 10px black;
}
.arrow{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    font-size:55px;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.arrow:hover{
    color:red;
}
.slide-up{
    transform:translateY(-100vh);
    opacity:0;
}
</style>
</head>

<body>

<section class="hero" id="page1">

    <h1>
        Farewell, good Strato.
        [Brutus runs on his sword.]<br><br>
        Caesar, now be still.<br><br>
        I killed not thee with half so good a will."(5.5.55-58)
    </h1>

    <div class="arrow" onclick="goNext()">↓</div>

</section>

<script>
function goNext(){
    document.getElementById("page1").classList.add("slide-up");

    setTimeout(() => {
        window.location.href = "brutus.html";
    }, 900);
}
</script>

</body>
</html>
