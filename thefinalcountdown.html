<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.cdnfonts.com/css/olde-english" rel="stylesheet">
<title>LAA Final Project</title>

<style>
body{
    margin:0;
    overflow:hidden;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
    box-sizing:border-box;
    background-image:url("./images/caesarghost.png");
    background-repeat:no-repeat;
    background-position:center 20%;
    background-size:cover;
    position:relative;
    transform:translateY(-100vh);
    animation:slideDown 1s ease forwards;
}

.info-text{
    color:white;
    font-family:'Olde English',sans-serif;
    font-size:2.7rem;
    max-width:950px;
    line-height:1.8;
}

.arrow{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    font-size:55px;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.arrow:hover{
    color:red;
}

.slide-left{
    animation:slideLeft 1s ease forwards;
}

@keyframes slideDown{
    from{
        transform:translateY(-100vh);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes slideLeft{
    from{
        transform:translateX(0);
        opacity:1;
    }
    to{
        transform:translateX(-100vw);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="info-text">
"Ghost: Thy evil spirit, Brutus.<br>
Brutus: Why com’st thou?<br>
Ghost: To tell thee thou shalt see me at Philippi.<br>
Brutus: Well, then I shall see thee again?<br>
Ghost: Ay, at Philippi." (5.5.324-330)
</div>

<div class="arrow" onclick="goNext()">←</div>

<script>
function goNext(){
document.body.classList.add("slide-left");
setTimeout(()=>{window.location.href="zoomout.html";},900);
}
</script>

</body>
</html>
