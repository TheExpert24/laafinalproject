<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.cdnfonts.com/css/olde-english" rel="stylesheet">
<title>LAA Final Project</title>

<style>
body{
    margin:0;
    overflow:hidden;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:40px;
    box-sizing:border-box;

    background-image:url("./images/32112323312.png");
    background-repeat:no-repeat;
    background-position:center 40%;
    background-size:cover;
}

.info-text{
    color:white;
    font-family:'Olde English',sans-serif;
    font-size:2.7rem;
    max-width:950px;
    line-height:1.8;
}
.arrow{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    font-size:55px;
    color:white;
    cursor:pointer;
    user-select:none;
    transition:0.3s;
}

.arrow:hover{
    color:red;
}
.slide-out{
    animation:slideOut 1s ease forwards;
}

@keyframes slideOut{
    from{
        transform:translateX(0);
        opacity:1;
    }
    to{
        transform:translateX(-100vw);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="info-text">
"Nay, I am sure it is, Volumnius.<br>
Thou seest the world, Volumnius, how it goes.<br>
Our enemies have beat us to the pit.<br>
It is more worthy to leap in ourselves"
</div>

<div class="arrow" onclick="goNext()">→</div>

<script>
function goNext(){
    document.body.classList.add("slide-out");

    setTimeout(() => {
        window.location.href = "nobleness.html";
    }, 900);
}
</script>

</body>
</html>
